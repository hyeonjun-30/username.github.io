<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Live Korean to English Subtitles</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: transparent;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
    }
    #container {
      position: absolute;
      bottom: 40px;
      left: 5%;
      width: 90%;
      text-align: center;
      pointer-events: none;
    }
    /* 한국어 원문 스타일 */
    #ko-text {
      font-size: 20px;
      font-weight: 600;
      color: #e0e0e0;
      margin-bottom: 6px;
      text-shadow:
        -1.5px -1.5px 0 #000,
         1.5px -1.5px 0 #000,
        -1.5px  1.5px 0 #000,
         1.5px  1.5px 0 #000,
         0 2px 6px rgba(0, 0, 0, 0.9);
      word-break: keep-all;
    }
    /* 영어 번역문 스타일 (크고 굵게 강조) */
    #en-text {
      font-size: 28px;
      font-weight: 800;
      color: #ffd700; /* 야외에서 잘 보이는 노란색 톤 */
      line-height: 1.3;
      text-shadow:
        -2px -2px 0 #000,
         2px -2px 0 #000,
        -2px  2px 0 #000,
         2px  2px 0 #000,
         0 3px 10px rgba(0, 0, 0, 0.95);
      word-break: keep-all;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="ko-text"></div>
    <div id="en-text"></div>
  </div>

  <script>
    const koElement = document.getElementById('ko-text');
    const enElement = document.getElementById('en-text');
    let hideTimer = null;
    let lastTranslatedText = '';

    // 무료 구글 번역 클라이언트 호출 함수 (서버 불필요)
    async function translateKoToEn(text) {
      if (!text || text.trim() === '' || text === lastTranslatedText) return;
      lastTranslatedText = text;

      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=ko&tl=en&dt=t&q=${encodeURIComponent(text)}`;
        const response = await fetch(url);
        const data = await response.json();
        
        if (data && data[0]) {
          const translated = data[0].map(item => item[0]).join('');
          enElement.innerText = translated;
        }
      } catch (err) {
        console.error('Translation error:', err);
      }
    }

    // Web Speech API (한국어 음성인식)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      enElement.innerText = "Speech Recognition not supported in this browser.";
    } else {
      const recognition = new SpeechRecognition();
      recognition.lang = 'ko-KR';
      recognition.continuous = true;
      recognition.interimResults = true; // 말하는 중간에도 즉각 반영

      recognition.onresult = (event) => {
        let interimText = '';
        let finalText = '';

        for (let i = event.resultIndex; i < event.results.length; i++) {
          if (event.results[i].isFinal) {
            finalText += event.results[i][0].transcript;
          } else {
            interimText += event.results[i][0].transcript;
          }
        }

        const currentSpeech = (finalText || interimText).trim();
        if (currentSpeech) {
          koElement.innerText = currentSpeech;

          // 단어/문장이 갱신될 때 실시간 영작 번역 호출
          translateKoToEn(currentSpeech);

          // 발화 종료 후 4초 뒤 자막 페이드아웃
          clearTimeout(hideTimer);
          hideTimer = setTimeout(() => {
            koElement.innerText = '';
            enElement.innerText = '';
            lastTranslatedText = '';
          }, 4000);
        }
      };

      // 인식 끊김 방지 (상시 수신 유지)
      recognition.onend = () => {
        try {
          recognition.start();
        } catch (e) {}
      };

      recognition.onerror = (e) => {
        console.error("STT Error:", e);
      };

      // 시작
      recognition.start();
    }
  </script>
</body>
</html>
