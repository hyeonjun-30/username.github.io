<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Free Live Subtitles</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: transparent;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
    }
    #container {
      position: absolute;
      bottom: 40px;
      left: 5%;
      width: 90%;
      text-align: center;
      pointer-events: none;
    }
    #subtitle {
      display: inline-block;
      color: #ffffff;
      font-size: 28px;
      font-weight: 800;
      line-height: 1.4;
      word-break: keep-all;
      /* 야외 영상에서도 선명하게 보이도록 강한 검은색 외곽선 및 그림자 */
      text-shadow:
        -2px -2px 0 #000,
         2px -2px 0 #000,
        -2px  2px 0 #000,
         2px  2px 0 #000,
         0 3px 8px rgba(0, 0, 0, 0.9);
      transition: opacity 0.3s ease;
    }
  </style>
</head>
<body>
  <div id="container">
    <span id="subtitle"></span>
  </div>

  <script>
    const subElement = document.getElementById('subtitle');
    let hideTimer = null;

    // 브라우저 내장 Web Speech API 호출
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      subElement.innerText = "이 브라우저는 음성 인식을 지원하지 않습니다.";
    } else {
      const recognition = new SpeechRecognition();
      recognition.lang = 'ko-KR';       // 한국어 인식
      recognition.continuous = true;     // 연속 인식
      recognition.interimResults = true; // 말하는 도중 실시간 갱신

      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }

        subElement.innerText = transcript;

        // 말이 멈추면 3.5초 뒤 자막 지우기
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => {
          subElement.innerText = '';
        }, 3500);
      };

      // 끊기면 자동으로 재연결하여 상시 유지
      recognition.onend = () => {
        try {
          recognition.start();
        } catch (e) {
          // 이미 실행 중일 경우 예외 무시
        }
      };

      recognition.onerror = (e) => {
        console.error("STT Error:", e);
      };

      // 시작
      recognition.start();
    }
  </script>
</body>
</html>
